schema: lri.rfc-viability-pilot/v1
status: preregistered_simulation_only
created: 2026-08-12
paper_draft: ../PAPER_DRAFT_LRI.md

purpose: >
  Falsify or provisionally retain the narrow RFC hypothesis before real-data scale-up.
  This pilot compares allocation of a common correction oracle. It does not measure
  human data efficiency, shared autonomy, force-aware contact control, general assembly,
  or augmentation/synthetic-correction generation.

provenance_contract:
  path: rfc_trial_contract.yaml
  validator: ../tools/validate_rfc_trial.py
  required_before_paired_analysis: true
  rule: >
    Each outer trial must save a frozen manifest and append-only event log that
    pass the contract validator. This checks data provenance and causal label
    availability only; it is not evidence of safety or method superiority.

task:
  family: locally_recoverable_insertion
  geometry:
    status: decision_required_before_execution
    recommended_default: cylindrical_peg_in_hole
    alternative: usb_like_insertion
    rationale: >
      A cylindrical peg isolates reference-relative perturbation and correction-budget allocation.
      USB-like insertion better matches the target narrative but can confound the pilot through asymmetric
      geometry, ambiguous seated-versus-jammed observation, and unmeasured contact force.
    interpretation_rules:
      cylindrical_peg_in_hole: >
        A positive result supports only the allocation mechanism under a simple, observable insertion geometry;
        it does not establish connector generalization.
      usb_like_insertion: >
        A negative result cannot distinguish RFC failure from missing F/T contact observability; it is therefore
        unsuitable as the sole viability gate on the current RGB-D/kinematic platform.
  nominal_reference:
    required: true
    properties:
      - collision_free
      - joint_limit_valid
      - fixed_reference_frame_convention
      - fixed_progress_bins
  train_cells:
    perturbation: [low, medium, boundary]
    observability: [visible]
  held_out_cells:
    perturbation: [held_out_combination, severe_out_of_domain]
    contact_recovery: [rim_or_skew, retreat_retry]

shared_controls:
  safety_gate:
    description: One state/constraint gate and one retreat/reset behavior for every condition.
    count_abstentions_in_denominator: true
  correction_source:
    kind: deterministic_local_geometric_mpc_oracle
    starts_from: perturbed_live_state
    fixed_across_conditions: true
    fixed_properties:
      - controller
      - action_limits
      - horizon
      - termination_criteria
      - reset_behavior
    prohibited_labels:
      - human_demonstration
      - human_time
  perturbation_pool:
    seeded: true
    identical_across_conditions: true
    selection_cannot_expand_safe_envelope: true
    role: collection_candidate_pool_only
    prohibition: >
      Do not evaluate on the adaptively selected collection candidates as the primary outcome.
      Candidate-pool statistics are collection-process diagnostics, not deployment performance.
  held_out_target_distribution:
    seeded: true
    frozen_before_collection: true
    disjoint_from_collection_candidate_opportunities: true
    identical_across_conditions: true
    stratification: [reference_progress, normalized_deviation, observability_validity, post_query_audit_outcome]
    primary_evaluation_rule: >
      Primary recovery is estimated only on this fixed distribution. Post-query outcome strata are
      used after evaluation for reporting and must never be used to generate or select current
      collection candidates.
  validation_distribution:
    seeded: true
    frozen_before_collection: true
    disjoint_from_collection_candidate_opportunities: true
    disjoint_from_held_out_target_distribution: true
    rule: >
      The only distribution permitted for score-weight, cell-boundary, threshold, architecture and
      training-schedule tuning. Final held-out target outcomes are never used for tuning.
  optional_natural_rollout_distribution:
    status: exploratory_if_measured
    rule: >
      Collect with no RFC candidate selection intervention and report separately. It cannot be
      reconstructed from either the collection pool or held-out target results.
  model_training:
    fixed_across_conditions:
      - initial_dataset
      - accepted_episode_count
      - accepted_frame_or_action_horizon_count
      - policy_architecture
      - optimizer
      - training_steps
      - random_seed_list
  outer_trials:
    experimental_unit: paired_collection_trial
    required: true
    frozen_assets_per_trial:
      - initial_dataset
      - seeded_safety_valid_candidate_pool
      - validation_distribution
      - held_out_target_distribution
      - paired_optimizer_seed_list
    rule: >
      Each primary condition uses identical frozen assets within an outer trial. The final RFC claim
      is analyzed from paired differences across independent outer trials, not only from episodes
      generated by one trained model.
    replication_count:
      status: pilot_variance_required_before_confirmatory_freeze
      rule: >
        Select the count from a predeclared precision or power calculation using pilot paired-trial
        variance. Do not stop after a favorable seed or target result.
  augmentation_policy:
    prohibited_for_primary_rfc_comparison:
      - condition_specific_synthetic_correction_generation
      - condition_specific_trajectory_augmentation
      - using_generated_corrections_as_extra_budget_free_training_data
    rationale: >
      JUICER and IntervenGen make generated/augmented corrective data a distinct mechanism.
      The RFC pilot isolates allocation of a fixed common oracle, not data generation.

conditions:
  J0:
    name: juicer_style_success_rollout_expansion
    scope: supplementary_not_primary_common_oracle_estimand
    query_rule: >
      Following the verified Collect-and-Infer aspect of JUICER, add only successful complete
      policy rollouts from the same evaluation budget to training, without querying the correction
      oracle for those rollouts. Report rollouts, environment interactions, and generated training
      frames separately; do not call this equal-correction-budget allocation.
    rationale: >
      Controls for a no-extra-oracle, success-only dataset expansion mechanism. It is not included
      in the primary common-oracle allocation estimand because it consumes a different resource.
  A0:
    name: random_safe_candidate_allocation
    query_rule: >
      Uniformly allocate the same future query budget over safety-valid candidate cells from the
      identical seeded pool. This controls for access to a pre-generated perturbation/candidate set.
  B2:
    name: reactive_dagger
    query_rule: >
      Query the shared oracle after an observed failure or shared-gate recovery trigger;
      do not optimize future cell allocation.
  I0:
    name: precision_risk_iil_style
    query_rule: >
      Use a disclosed precision/risk score to prioritize current-rollout correction opportunities;
      retain the common online gate and do not use RFC cross-round coverage allocation.
  T0:
    name: thriftydagger_style_novelty_risk_gating
    scope: required_direct_interactive_il_control
    query_rule: >
      Use a disclosed novelty/risk score and the same intervention/correction budget to decide
      when the shared correction source is engaged during a current rollout. It does not allocate
      future candidate cells by reference progress or recovery-frontier coverage.
    fairness_rule: >
      For the primary allocation contrast, run T0 behind the same outer safety gate and candidate
      pool. Report both its online-gating budget and all attempted candidate outcomes separately.
  U0:
    name: generic_uncertainty_coverage_allocation
    query_rule: >
      Before each collection round, allocate the fixed future query budget using the same empirical
      uncertainty and coverage statistics as RFC, but without reference-progress coordinates or
      reference-relative normalization. Use an observation/state-space partition with matched cell
      count and update schedule. This controls for generic active data selection.
  B3_no_z:
    name: rfc_without_reference_progress
    query_rule: >
      Apply the RFC score and safety-valid candidate pool but remove reference-progress bin z;
      retain normalized reference-relative deviation and pre-query observability/validity features.
      This ablation tests whether progress alignment, rather than generic deviation binning, matters.
  B3_no_rec:
    name: rfc_without_historical_recoverability
    query_rule: >
      Keep the same reference cells (z, delta, v), target weights, candidate pool, shared safety gate,
      coverage term, round schedule, correction budget, and deterministic tie-breaking as B3. Set all
      history-derived recoverability, uncertainty, and failure terms to zero; no prior correction success,
      failure, abstention, contact, or recovery outcome may rank a future candidate. This isolates the
      incremental value of outcome-conditioned recovery-frontier selection beyond reference-stratified coverage.
  B3:
    name: reference_aligned_recovery_frontier_collection
    query_rule: >
      Before each collection round, allocate a fixed future query budget over candidate cells using
      reference-progress bin, normalized reference-relative deviation, coverage support, and only
      pre-query outcome estimates. Online gate is shared with B2 and I0.

rfc_query_cell:
  pre_query_fields:
    z: reference_progress_bin
    delta: normalized_reference_relative_pose_deviation
    v: observability_or_validity_label
  post_query_audit_labels:
    c: observed_contact_or_recovery_outcome_label
    outcome: oracle_correction_outcome_label
  rules:
    - z_is_not_a_learned_contact_phase_controller
    - c_is_never_an_input_to_query_scoring_for_the_same_unexecuted_candidate
    - c_is_used_only_for_post_query_audit_next_round_aggregation_and_held_out_stratification
    - post_query_outcomes_are_never_used_to_rank_the_current_round_candidate_set
    - delta_translation_is_normalized_by_clearance
    - delta_rotation_is_normalized_by_declared_orientation_tolerance

budget:
  unit: oracle_query_and_corrected_horizon
  predeclare:
    - total_oracle_queries
    - total_corrected_horizon_steps
    - rollout_count
    - reset_setup_accounting
  prohibited:
    - human_minutes_in_simulation
    - post_hoc_best_budget_selection
  T0_accounting:
    required:
      - online_intervention_trigger_count
      - online_intervention_horizon_steps
      - total_oracle_queries_and_corrected_horizon_steps
      - candidate_pool_exposure_count
    interpretation: >
      T0 has a distinct decision locus (current-rollout engagement). Its comparison with RFC is
      valid only after matching the common correction-source query/corrected-horizon budget and
      reporting its additional timing/trigger accounting; do not infer a human-burden result from
      the simulation pilot.

logging_contract:
  required_episode_fields:
    - episode_id
    - condition_id
    - seed
    - task_geometry_id
    - nominal_reference_id
    - perturbation_cell_id
    - rfc_query_cell
    - post_query_audit_labels
    - shared_gate_outcome
    - correction_source_kind
    - oracle_query_index
    - corrected_horizon_steps
    - candidate_opportunities_exposed
    - unique_accepted_episode_count
    - unique_training_frame_count
    - duplicated_or_replayed_training_frame_count
    - training_update_count
    - pre_query_score_inputs
    - post_query_outcome_label
    - recovery_success
    - task_success
    - abstention_or_rejection_reason
    - constraint_violation
  immutable_audit_fields:
    - candidate_pool_id
    - safety_gate_version
    - oracle_version
    - policy_config_hash
    - training_config_hash

analysis:
  primary_metric: held_out_recovery_success_per_matched_oracle_query_corrected_horizon
  primary_estimand: >
    P(recover | B3, held_out, B_corr) -
    max(P(recover | A0, held_out, B_corr), P(recover | B2, held_out, B_corr),
    P(recover | I0, held_out, B_corr), P(recover | T0, held_out, B_corr),
    P(recover | U0, held_out, B_corr),
    P(recover | B3_no_z, held_out, B_corr),
    P(recover | B3_no_rec, held_out, B_corr))
  uncertainty:
    method: paired_outer_trial_bootstrap_with_nested_episode_diagnostic
    grouping: [outer_collection_trial, paired_optimizer_seed, test_episode, session_or_seed]
    prohibited: frame_level_p_values
  tuning_firewall:
    target_distribution_used_for_tuning: false
    validation_distribution_used_for_tuning: true
    amendment_required_after_target_inspection: true
  data_accounting:
    required:
      - candidate_opportunities_exposed
      - attempted_queries
      - rejected_queries
      - oracle_queries
      - corrected_horizon_steps
      - unique_accepted_episodes
      - unique_training_frames
      - duplicated_or_replayed_frames
      - training_updates
      - wall_clock_and_oracle_calls
    reporting:
      - fixed_correction_budget_all_attempt_analysis
      - separately_labelled_fixed_training_frame_sensitivity_analysis
  required_secondary_metrics:
    - all_attempt_task_success
    - all_attempt_recovery_success
    - abstention_rate
    - constraint_violation_rate
    - frontier_cell_coverage
    - corrected_success_fraction
    - successful_rollout_expansion_fraction
    - collection_candidate_pool_coverage_and_outcome
    - optional_natural_rollout_success_if_measured
  reporting_rules:
    - report_conditional_success_and_all_attempt_success_separately
    - report_all_attempt_abstentions_and_rejections
    - do_not_select_the_best_budget_after_observing_curves

decision_gate:
  retain_rfc_only_if:
    - B3_exceeds_A0_on_primary_metric_at_declared_budget
    - B3_exceeds_B2_on_primary_metric_at_declared_budget
    - B3_exceeds_I0_on_primary_metric_at_declared_budget
    - B3_exceeds_T0_on_primary_metric_at_declared_budget
    - B3_exceeds_U0_on_primary_metric_at_declared_budget
    - B3_exceeds_B3_no_z_on_primary_metric_at_declared_budget_or_reports_no_progress_specific_claim
    - B3_exceeds_B3_no_rec_on_primary_metric_at_declared_budget_or_removes_recovery_frontier_wording
    - grouped_bootstrap_interval_supports_all_required_differences
    - B3_has_no_worse_all_attempt_safety_or_abstention_outcome
  otherwise:
    action: switch_primary_paper_path_to_evaluation_systems
    required_draft_changes:
      - remove_frontier_collection_from_title_abstract_and_contributions
      - retain_RFC_as_exploratory_diagnostic_only
      - focus_on_auditable_episode_contract_and_split_protocol

evidence_ladder:
  simulation: >
    Establishes only allocation efficiency for the disclosed common oracle.
  human_replication: >
    Must use a separately frozen, physically reproducible candidate-state protocol; match active
    operator time and reproduce the ranking before any claim about human correction burden or
    human-data efficiency. A simulator-selected state is not automatically a feasible or repeatable
    real-robot collection opportunity.
  disagreement_rule: >
    A disagreement between oracle simulation and teleoperation is a reported sim-to-real negative
    result, not a license to select the favorable result.

human_replication_contract:
  status: required_before_human_efficiency_claim
  candidate_state_protocol:
    allowed_mechanisms:
      - fixture_indexed_target_pose_offsets_with_measured_repeatability
      - robot_reset_to_validated_pre_contact_waypoint_then_controlled_offset
      - externally_measured_object_pose_perturbation_with_acceptance_tolerance
    required_per_candidate:
      - physical_candidate_id
      - setup_mechanism_and_reset_procedure
      - measured_initial_pose_or_state
      - target_tolerance_and_repeatability_estimate
      - safety_precheck_result
      - pre_query_features_available_to_all_conditions
    prohibited:
      - selecting_unreproducible_accidental_contact_states_as_if_they_were_pool_samples
      - using_simulator_only_contact_labels_to_rank_real_candidates
  matched_resources:
    - active_operator_correction_seconds
    - number_of_candidate_resets_and_setup_time
    - safety_abort_and_recovery_time
    - same_physical_candidate_pool_or_counterbalanced_matched_pool
  interpretation: >
    The simulation result tests common-oracle allocation. The human result tests allocation over
    declared reproducible physical opportunities. Agreement is empirical transfer evidence, not an
    assumed equivalence between the two candidate spaces.

open_decisions:
  - id: pilot_geometry
    question: Which geometry is frozen for the RFC viability pilot?
    recommended_default: cylindrical_peg_in_hole
    required_before_execution: true
  - id: rfc_method_status
    question: >
      Is the team willing to include A0/U0/B3_no_z/B3_no_rec and accept that RFC becomes an exploratory
      diagnostic if it does not beat generic active allocation? Without these controls, do not call RFC a novel method.
    required_before_execution: true
  - id: intervengen_comparison_scope
    question: >
      Will the final study implement an I-Gen-style synthetic corrective-data baseline under a
      separately matched generation/interaction protocol, or explicitly limit RFC to selection
      efficiency among real correction opportunities? I-Gen uses object-centric source recovery
      transformation/replay and additional synthetic rollouts; the simulation oracle allocation
      pilot is not a direct comparison to intervention generation.
    required_before_final_contribution_claim: true
  - id: juicer_comparison_scope
    question: >
      Will the final study run J0 as a disclosed supplementary resource-different comparison, or
      explicitly restrict the claim to oracle-correction allocation and explain why JUICER's
      augmentation/success-rollout expansion has a different budget? Do not imply a fair
      equal-budget superiority comparison without matching environment-interaction and data volume.
    required_before_final_contribution_claim: true
