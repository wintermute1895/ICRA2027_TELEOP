# LBot Teleoperation Configuration
# 遥操作配置文件 - 所有从臂配置集中在此

#========================================
# 从臂配置 (唯一需要修改的地方)
#========================================
# 从臂 IP 地址列表，自动生成 robot1, robot2, robot3...
slave_arm_ips:
  - "192.168.10.21"
  # - "192.168.10.22"  # 取消注释启用第二台从臂

teleop_bridge_node:
  ros__parameters:
    #========================================
    # 话题配置
    #========================================
    # 主臂(遥操臂)话题 - 来自 linkerta
    master_left_topic: "/left_arm_joint_control"
    master_right_topic: "/right_arm_joint_control"
    
  
    #========================================
    # 转换配置
    #========================================
    # 缩放比例 (1.0 = 1:1 映射)
    scale_factor: 1.0
    
    # 跟随模式
    follow_mode: true

    # One-Euro filter is applied in radians after joint-index mapping and
    # before the verified left/right direction signs. These values match the
    # MuJoCo validation path.
    enable_one_euro_filter: true
    one_euro_min_cutoff_hz: 1.5
    one_euro_beta: 0.08
    one_euro_derivative_cutoff_hz: 1.0

    # 机器人类型: LS 或 RS
    robot_type: "RS"

    #========================================
    # 首次移动配置
    #========================================
    first_move_speed: 0.2
    first_move_acce: 0.2

    #========================================
    # 使能配置
    #========================================
    enable_left_arm: false
    enable_right_arm: true

    # Master-arm calibration can differ from the slave hard stop by a few
    # milliradians. Commands within this tolerance are clamped to the safe
    # limit; larger violations are still rejected.
    joint_limit_tolerance_rad: 0.01

    #========================================
    # 关节映射
    #========================================
    # 主臂关节索引 -> 从臂关节索引
    # 默认: [0,1,2,3,4,5,6] 表示一一对应
    left_joint_mapping: [0, 1, 2, 3, 4, 5, 6]
    right_joint_mapping: [0, 1, 2, 3, 4, 5, 6]

    # 主臂正方向 -> 从臂控制器正方向
    # 顺序为 J1..J7；这是中间桥接层映射，不修改底层 SDK/控制器数值定义。
    # 以原 RS 全反映射为基线，根据真机方向测试结果对反向关节再次取反。
    left_negation: [1, 1, 1, -1, 1, -1, 1]
    right_negation: [1, 1, 1, 1, 1, -1, 1]

    #========================================
    # 安全限位使能
    #========================================
    enable_joint_limits: true
