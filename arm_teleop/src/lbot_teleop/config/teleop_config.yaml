# LBot Teleoperation Configuration
# 遥操作配置文件 - 所有从臂配置集中在此

#========================================
# 从臂配置 (唯一需要修改的地方)
#========================================
# 从臂 IP 地址列表，自动生成 robot1, robot2, robot3...
slave_arm_ips:
  - "192.168.10.21"
  # - "192.168.10.22"  # 取消注释启用第二台从臂

teleop_bridge_node:
  ros__parameters:
    #========================================
    # 话题配置
    #========================================
    # 主臂(遥操臂)话题 - 来自 linkerta
    master_left_topic: "/left_arm_joint_control"
    master_right_topic: "/right_arm_joint_control"
    
  
    #========================================
    # 转换配置
    #========================================
    # 缩放比例 (1.0 = 1:1 映射)
    scale_factor: 1.0
    
    # 跟随模式
    follow_mode: true

    # 机器人类型: LS 或 RS
    robot_type: "RS"

    #========================================
    # 首次移动配置
    #========================================
    first_move_speed: 0.2
    first_move_acce: 0.2

    #========================================
    # 使能配置
    #========================================
    enable_left_arm: true
    enable_right_arm: true

    #========================================
    # 关节映射
    #========================================
    # 主臂关节索引 -> 从臂关节索引
    # 默认: [0,1,2,3,4,5,6] 表示一一对应
    left_joint_mapping: [0, 1, 2, 3, 4, 5, 6]
    right_joint_mapping: [0, 1, 2, 3, 4, 5, 6]

    #========================================
    # 安全限位使能
    #========================================
    enable_joint_limits: true
