schema: robot_teleop.flywheel-config/v1

storage:
  # Task1 episodes are stored directly under this directory rather than in an
  # evidence/teleop hierarchy. Derived outputs stay beside their source run.
  data_root: /media/fanshihao/Cyan_data/ICRA2027_DATA/Task_Data/Task1_Data
  run_root: /media/fanshihao/Cyan_data/ICRA2027_DATA/Task_Data/Task1_Data/filter_runs
  model_cache: /media/fanshihao/Cyan_data/ICRA2027_MODELS/huggingface

processing:
  task_id: precision_alignment
  task_revision: precision_alignment_v1
  derived_name: task1_precision_alignment_v1
  arm: right
  source_domain: real
  collection_mode: teleop_rule
  expert_action_field: master_joint_raw
  quality_gate: config/experiments/data_quality_gate.yaml
  require_quality_pass: true
  use_reviewed_events: true
  camera_ids: [main_rgb, auxiliary_rgb]
  max_camera_age_ms: 100.0

vlm:
  enabled: true
  embedding_dim: 1536
  model_id: google/siglip2-base-patch16-224
  revision: 75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2
  device: cuda
  batch_size: 32
  allow_network: false
  drop_unmatched: true

training:
  enabled: true
  action_contract: arm7
  model_config: config/filters/trajectory_cvae_transformer_v0_2_vlm.yaml
  model_config_no_vlm: config/filters/trajectory_cvae_transformer_v0_1.yaml
  device: cuda
  require_cuda: true
  epochs: 50
  batch_size: 64
  validation_episodes: 3

control:
  deployment_config: config/runtime/learned_filter.yaml
