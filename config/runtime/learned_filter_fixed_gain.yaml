schema: robot_teleop.learned-filter-runtime/v1
enabled: false
checkpoint: ""
checkpoint_sha256: ""
device: cuda
socket: /tmp/teleop_learned_filter.sock
model_cache: /media/ilex/Cyan_data/ICRA2027_MODELS/huggingface
inference_hz: 25.0
execution_mode: receding_horizon
# Explicit deployment ablation. This is not a learned gain.
authority:
  mode: fixed
  gain: 0.05
execution_feedback:
  enabled: false
  topic: /teleop_filter/right/controller_issued_action_rad
  semantics: controller_issued_action
  coordinate_space: filter_master
  units: rad
input_timeout_ms: 100.0
safety:
  joint_min_rad: [-1.05, -3.49, -2.79, -0.21, -2.79, -1.57, -1.57]
  joint_max_rad: [2.97, 0.35, 2.79, 2.355, 2.79, 1.57, 1.57]
  max_residual_rad: 0.01
  max_residual_rate_rad_s: 0.05
  max_command_velocity_rad_s: 0.5
  max_model_age_ms: 100.0
arm: right
master_input_topic: /right_arm_joint_control
master_output_topic: /teleop_filter/right_arm_joint_control
state_topic: /robot1/right_arm/joint_states
raw_observation_topic: /teleop_filter/right/master_joint_raw_rad
filtered_observation_topic: /teleop_filter/right/master_joint_filtered_rad
diagnostics_topic: /teleop_filter/right/diagnostics
cameras:
  - id: main_rgb
    topic: /camera/camera/color/image_raw
  - id: auxiliary_rgb
    topic: /camera2/camera/color/image_raw
