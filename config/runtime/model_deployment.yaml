schema: robot_teleop.model-deployment/v1
enabled: true
source: teleop
arm: right
input_units: degrees
fallback_topic: /right_arm_joint_control
output_topic: /model_deployment/right_arm_joint_control
candidate_topics:
  filter: /teleop_filter/right_arm_joint_control
  act: /act/right_arm_joint_control
state_topic: /robot1/right_arm/joint_states
diagnostics_topic: /model_deployment/diagnostics
timeout_ms: 2000
# Residual-style candidates (learned filter) stay inside a tight window.
max_delta_rad: 0.05
max_step_rad: 0.05
# ACT publishes absolute joint targets.  Reusing the residual window rejects
# the first command; these limits apply when source=act.
act_max_delta_rad: 0.6
act_max_step_rad: 0.6
# Active mode is intentionally impossible without an explicit approval token.
approval_token: ""
