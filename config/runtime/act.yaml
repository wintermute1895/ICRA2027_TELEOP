schema: robot_teleop.act-runtime/v1
enabled: false
checkpoint: ""
checkpoint_sha256: ""
device: cuda
socket: /tmp/teleop_act.sock
inference_hz: 10.0
runtime_n_action_steps: 2
input_timeout_ms: 2000.0
max_input_age_ms: 250.0
max_observation_skew_ms: 100.0
max_candidate_age_ms: 300.0
reset_gap_ms: 2000.0
action_units: radians
action_contract: arm7
state_dim: 7
action_dim: 7
image_shape: [480, 640]
output_topic: /act/right_arm_joint_control
state_topic: /robot1/right_arm/joint_states
diagnostics_topic: /act/right/diagnostics
state_key: observation.state
# Keys must match the feature names used when the ACT dataset was trained.
camera_keys:
  observation.images.main_rgb: /camera/camera/color/image_raw
  observation.images.auxiliary_rgb: /camera2/camera/color/image_raw
dataset_stats: ""
