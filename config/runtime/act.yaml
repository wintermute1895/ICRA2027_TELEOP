schema: robot_teleop.act-runtime/v1
enabled: false
checkpoint: ""
checkpoint_sha256: ""
device: cuda
socket: /tmp/teleop_act.sock
inference_hz: 10.0
input_timeout_ms: 300.0
action_units: radians
output_topic: /act/right_arm_joint_control
