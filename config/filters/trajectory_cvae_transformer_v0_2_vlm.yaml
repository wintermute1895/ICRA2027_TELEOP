schema: robot_teleop.trajectory-filter-model/v0.1
model:
  model_type: cvae_rate_limited
  authority_mode: rate_limited
  history_length: 16
  horizon: 8
  latent_dim: 8
  model_dim: 128
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  context_dim: 0
  visual_dim: 1536 # two SigLIP2-base image embeddings, 768d per camera, concat in camera order
  gate_enabled: false # legacy diagnostic only; not part of the paper model
  gain_enabled: true
  alpha_max: 1.0
  alpha_rate: 0.1
  gain_current_command: true
loss:
  beta_kl: 0.001
  smoothness_weight: 0.01
  correction_weight: 2.0
  gate_weight: 0.0
  gain_weight: 0.25
  zero_weight: 0.05
  alpha_low: 0.05
  alpha_high: 0.5
data:
  allow_synthetic_smoke: false
runtime:
  deterministic_prior: true
  blend: 0.35
  max_correction_rad: 0.05
  deployment: offline_and_simulation_only
semantics:
  prior: learned_conditional_prior_from_past_raw_and_executed_commands_states_and_frozen_vlm_embedding
  posterior: training_only_conditioned_on_explicit_expert_action_target
  target: expert_action_target_rad_is_human_command_for_round0_and_audited_executed_action_for_assisted_rounds
  gate: correction_probability_supervised_by_human_correction_mask
  visual_encoder: two_frozen_siglip2_base_768d_embeddings_concatenated_in_camera_order
  quality_claim: reconstruction_and_kl_are_model_diagnostics_not_ground_truth_human_quality
