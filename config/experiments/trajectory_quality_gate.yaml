schema: robot_teleop.trajectory-quality-gate/v1
thresholds:
  tracking_error_rms_rad_max: 0.12
  tracking_error_p95_rad_max: 0.20
  velocity_p95_rad_s_max: 1.50
  acceleration_p95_rad_s2_max: 8.0
  jerk_p95_rad_s3_max: 80.0
  minimum_singular_value_min: 0.015
  minimum_clearance_m_min: 0.010
requirements:
  require_mapped_command: true
  require_planning_singularity_metric: false
  require_collision_clearance_metric: false
notes:
  - This gate measures offline control trajectory quality, not task completion.
  - Enable singularity and clearance requirements only after the matching URDF and scene collision contract are attached.
