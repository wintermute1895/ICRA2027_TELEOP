schema: robot_teleop.experiment-profile/v1
experiment_id: precision_assembly_ab_v1
task_family: precision_assembly
experiment_phase: exploratory
conditions:
  nominal_reference_v1:
    role: A
    profile: config/conditions/nominal_reference_v1.yaml
  bc_all_v1:
    role: B0
    profile: config/conditions/bc_all_v1.yaml
  reference_residual_bc_v1:
    role: B1
    profile: config/conditions/reference_residual_bc_v1.yaml
  reference_residual_dagger_v1:
    role: B2
    profile: config/conditions/reference_residual_dagger_v1.yaml
design:
  unit: episode
  within_subject: true
  randomize_condition_order: true
  practice_episodes: 1
  pilot_valid_episodes_per_condition: 10
recording:
  episode_schema: robot_teleop.episode/v1
  camera_profile: 640x480@15
  require_rgb: true
  require_depth: true
evaluation:
  local_evaluators:
    - tools/score_episode_data_quality.py
    - tools/evaluate_trajectory_quality.py
    - tools/mine_hard_cases.py
  optional_external_evaluator: DexCatch/tools/evaluate_episode_quality.py
  keep_failed_episodes: true
  failure_action: review
safety:
  observation_only_default: true
  real_robot_requires_physical_estop: true
  allow_remote_unattended_execution: false
